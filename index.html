<nav class="navbar">
  <div class="logo">
    Қорқынышты әңгімелер
  </div>

  <div class="nav-links">
    <a href="#">Басты бет</a>
    <a href="#">Жаңа</a>
    <a href="#">Таңдаулы</a>
    <a href="#">Авторлар</a>
  </div>

  <button class="menu-btn" id="menuBtn">≡</button>
</nav>

<style>
  .navbar {
    width: 100%;
    padding: 15px 30px;
    background: #111;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #222;
  }

  .logo {
    font-family: 'Creepster', cursive;
    font-size: 26px;
    color: var(--accent, #e63946);
  }

  .nav-links {
    display: flex;
    gap: 25px;
  }

  .nav-links a {
    text-decoration: none;
    color: #ddd;
    font-size: 17px;
    transition: 0.2s ease;
  }

  .nav-links a:hover {
    color: var(--accent, #e63946);
  }

  .menu-btn {
    display: none;
    background: none;
    border: none;
    color: #fff;
    font-size: 26px;
    cursor: pointer;
  }

  @media (max-width: 700px) {
    .nav-links {
      display: none;
      position: absolute;
      right: 20px;
      top: 65px;
      background: #111;
      flex-direction: column;
      padding: 15px;
      border: 1px solid #222;
      border-radius: 6px;
    }

    .nav-links.show {
      display: flex;
    }

    .menu-btn {
      display: block;
    }
  }
</style>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const links = document.querySelector('.nav-links');

  menuBtn.onclick = () => {
    links.classList.toggle('show');
  };
</script>
