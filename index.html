<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Қорқынышты Әңгімелер — Түнгі Оқиғалар</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1: #0b0f12;
      --bg2: #111217;
      --accent: #c33b3b;
      --muted: #9aa0a6;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
    }
    html,body{height:100%;margin:0;font-family:"Inter",system-ui,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#e8eef2;display:flex;align-items:center;justify-content:center;padding:32px;}
    .app{width:100%;max-width:980px;display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start;}
    header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .title{display:flex;align-items:baseline;gap:12px;}
    h1{margin:0;font-family:"Creepster",cursive;font-size:34px;color:var(--accent);text-shadow:0 6px 20px rgba(195,59,59,0.08),0 1px 0 rgba(0,0,0,0.7);}
    .subtitle{color:var(--muted);font-size:13px;margin-top:6px;}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.02);min-height:420px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.03);}
    .meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .tag{background:var(--glass);padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,0.02);}
    .story{font-size:18px;line-height:1.7;color:#f3f7f8;white-space:pre-wrap;min-height:260px;max-height:420px;overflow:auto;padding-right:8px;letter-spacing:0.2px;font-weight:300;}
    .controls{display:flex;gap:10px;margin-top:18px;}
    button{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);padding:10px 14px;border-radius:10px;color:#e8eef2;cursor:pointer;font-weight:600;transition: transform .12s ease, box-shadow .12s;}
    button:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.55);}
    .danger{border-color:rgba(195,59,59,0.4);color:var(--accent);}
    aside{background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);border-radius:16px;padding:18px;height:100%;border:1px solid rgba(255,255,255,0.03);}
    .list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
    .story-item{padding:10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);background:transparent;border:1px dashed rgba(255,255,255,0.02);}
    .story-item:hover{color:#fff;background:var(--glass-2);}
    footer.app-footer{grid-column:1/3;margin-top:18px;text-align:center;color:var(--muted);font-size:13px;}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="title">
        <h1>Қорқынышты Әңгімелер</h1>
        <div class="subtitle">Түнгі оқиғалар — нағыз қорқыныш</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="randomBtn">Кездейсоқ</button>
        <button id="reveal" class="danger">Барлығын көрсету</button>
        <button id="extraBtn">Қосымша</button>
      </div>
    </header>
    <main class="card" aria-live="polite">
      <div class="meta">
        <div class="tag" id="tag">Әңгіме 1 / 3</div>
      </div>
      <div class="story" id="story"></div>
      <div class="controls">
        <button id="prev">◀ Алдыңғы</button>
        <button id="next">Келесі ▶</button>
      </div>
    </main>
    <aside>
      <div style="font-weight:600">Әңгімелер</div>
      <div class="list" id="list"></div>
      <div style="margin-top:12px;font-size:13px;color:var(--muted)">Жеңіл қорқыныш үшін — терең дем алып, күліңіз :)</div>
    </aside>
    <footer class="app-footer">© Haunted Night — @caytlinisthebest</footer>
  </div>

  <script>
    const STORIES = [
      {title: "Ростов өлтірушісі", text: "Ол әрқашан көпшілік арасына сіңіп кететін. Қарапайым киінген, басы салбырап, қолында ескі сөмкесі бар — дәл мыңдаған адамдардың бірі сияқты. Бірақ оның бет-жүзіне мән берсең, ерекше ештеңе байқалмайды. Тек көзі ғана… тым тыныш, тым суық еді.
      Ол адамдарды армансыз бақылаушы еді. Шамы әлсіз жанып тұрған көшелерде жүруді жақсы көретін. Әр адамның қимылын, темпін, даусын және қорқыныш пайда болғандағы алғашқы белгілерін есте сақтайтын. Шын мәнінде, ол ешқашан құрбандарын кездейсоқ таңдамайтын. Адамдар «жолым болмай қалды» деп ойлайтын, бірақ олай емес — ол оларды баяғыда-ақ белгілеп қойған болатын.
      Көше шамдары қараңғы түнде әлсіз дірілдеп тұрғанда, оның көлеңкесі ұзарып, шудың арасынан үнсіз сырғып өтетін. Әр қадамы есептелген, әр бұрылысы алдын ала ойластырылған. Тек бір сәт келеді — ол тоқтайды. Адам оның жанынан өткелі тұр. Құрбан әлі ештеңе сезбейді, бірақ тиісінше бір нәрсе бұзылғанын жүрегімен сезетіндей.
      Ол алыстан қарап тұрғанда, қала әдеттегідей тыныш көрінеді. Бірақ, оның бақылауы астына түскен әрбір жан біртіндеп қатты тұзаққа жақындай түседі. Күткеніне қарамастан, ешкім күдіктенбейді — өйткені ол тым қалыпты көрінеді.
      Ал олар түсінген кезде… тым кеш болатын.Түн олардың айқайын жұтып қояды, ал оның көлеңкесі ешқашан тоқтамайды."},
      {title: "Уайтчепелдің көлеңкесі", text: "Лондонның ескі аудандарында біртүрлі үнсіздік бар. Тіпті түнгі тұман да мұнда басқа жерден өзгеше: қою, ауыр және тірі сияқты. Адамдар кейде сол тұманның ішінде әлсіз қадамдарды естіп, бұрылғанда — ешкімді көрмейтін. Бірақ қадамдар әлі де жақындап келе жатқандай әсер қалдыратын.
      Көшелер тар, ескі кірпіштер сулы, ал шырақтар әлсіз жарық шашады. Кейбіреулер жарыққа қараса, ішінде бір сәтке қозғалып тұрған силуетті көргендерін айтатын. Бірақ екінші рет қарағанда — ол жоғалып кетеді.
      Аңыздарға қарағанда, бір кездері осы аудандарда бір қараңғы тұлға жүрген. Оның не адам, не аруақ екені белгісіз. Бірақ ол көрінетін жерде суық жел соғып, тұман қоюлана түсетін. Адамдар оның бар екенін сезетін, бірақ оны ешкім анық көрмейтін.
      Құрбандарының соңғы айтқандары бір-біріне ұқсайтын:
      — Артымнан біреу қарап тұрғандай болды…
      — Біреу демалып тұрғанын сездім…
      — Бұрылғанда ешкім жоқ сияқты еді…
      Сол көлеңке ешқашан жүгірмейді, ешқашан дыбыс шығармайды. Тек қарап тұрады.
      Ал біреу артынан қарағанын сезген кезде — тым кеш.
      Себебі ол сені әлдеқашан таңдап қойған."},
      {title: "Сымбатты өлтіруші", text: "Ол жай ғана тартымды адам емес еді — ол сенімнің иісі шығатын адам болатын. Оның дауыс ырғағында бір жұмсақтық, бір жылы сендіру бар. Телефондағы кеңесші сияқты сөйлесе алады, немесе балаға ертегі оқып тұрғандай мейірімді еді.
      Оның құрбандары оның жанында еш қауіп сезбейтін. Керісінше, өзін жақын досымен сөйлесіп тұрғандай жайлы сезінетін. Көмек сұраса көмектеседі, сұрақ қойса түсіндіреді, ал әңгімені сондай нәзік бағыттайды — адам өз құпиясын өзі-ақ ашып береді.
      Ол ешқашан айқайламайтын. Ешқашан ашуланбайтын. Тіпті жәбір көрсететіндей әрекет те жасамайтын.
      Сондықтан оның құрбандары:
      — Мен оны танитын сияқтымын,
      — Ол мейірімді еді,
      — Қорқынышты ештеңе сезбедім,
      — Өз еркіммен бардым…
      деп айтатын.
      Бірақ есік жабылған сәтте — бәрі өзгеретін.
      Оның көзінде ешқандай эмоция қалмайды. Ол жымиып тұрғанымен, алдыңдағы адам емес екені айқын білінеді.
      Оның артында ештеңе жоқ — мейірім де, жанашырлық та, адамдық та.
      Тек маскадан арылған бос, мұздай тұлға."}
    ];

    const storyEl = document.getElementById('story');
    const tagEl = document.getElementById('tag');
    const listEl = document.getElementById('list');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const randomBtn = document.getElementById('randomBtn');
    const revealBtn = document.getElementById('reveal');
    const extraBtn = document.getElementById('extraBtn');

    let idx = 0;
    let typing = false;

    STORIES.forEach((s,i)=>{
      const it = document.createElement('div');
      it.className='story-item';
      it.textContent = `${i+1}. ${s.title}`;
      it.addEventListener('click', ()=> showStory(i));
      listEl.appendChild(it);
    });

    function showStory(i){
      idx = i;
      tagEl.textContent = `Әңгіме ${i+1} / ${STORIES.length}`;
      typeWriter(STORIES[i].text);
    }

    async function typeWriter(text){
      if(typing) return;
      typing=true;
      storyEl.textContent = "";
      for(let c=0;c<text.length;c++){
        storyEl.textContent += text[c];
        storyEl.scrollTop = storyEl.scrollHeight;
        await new Promise(res=>setTimeout(res,18 + (text[c]==='.'?60:0)));
      }
      typing=false;
    }

    prevBtn.addEventListener('click', ()=>{ if(!typing){ idx=(idx-1+STORIES.length)%STORIES.length; showStory(idx); } });
    nextBtn.addEventListener('click', ()=>{ if(!typing){ idx=(idx+1)%STORIES.length; showStory(idx); } });
    randomBtn.addEventListener('click', ()=>{ const r=Math.floor(Math.random()*STORIES.length); showStory(r); });
    revealBtn.addEventListener('click', ()=>{ typing=false; storyEl.textContent=STORIES[idx].text; });
    extraBtn.addEventListener('click', ()=>{ window.location.href='extra.html'; });

    showStory(0);

    // SCREAMER ON PAGE LOAD
    window.onload = function(){
      const img = document.createElement("img");
      img.src="https://i.imgur.com/your-scary-image.gif";
      img.style.position="fixed"; img.style.top="0"; img.style.left="0";
      img.style.width="100vw"; img.style.height="100vh";
      img.style.zIndex="9999"; img.style.backgroundColor="#000";
      document.body.appendChild(img);

      const audio = new Audio("https://www.myinstants.com/media/sounds/scream.mp3");
      audio.play();

      setTimeout(()=>{ document.body.removeChild(img); },1500);
    };
  </script>
</body>
</html>
