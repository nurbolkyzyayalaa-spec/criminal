<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scary Stories — Haunted Night</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #0b0f12;
      --bg2: #111217;
      --accent: #c33b3b;
      --muted: #9aa0a6;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(195,59,59,0.06), transparent),
                  radial-gradient(800px 500px at 90% 90%, rgba(50,50,70,0.04), transparent),
                  linear-gradient(180deg,var(--bg1),var(--bg2));
      color:#e8eef2;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    .app{
      width:100%;
      max-width:980px;
      display:grid;
      grid-template-columns: 1fr 360px;
      gap:28px;
      align-items:start;
    }

    /* Header */
    header{
      grid-column:1/3;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .title{
      display:flex;
      align-items:baseline;
      gap:12px;
    }
    h1{
      margin:0;
      font-family: "Creepster", cursive;
      font-size:34px;
      letter-spacing:1px;
      color:var(--accent);
      text-shadow: 0 6px 20px rgba(195,59,59,0.08), 0 1px 0 rgba(0,0,0,0.7);
    }
    .subtitle{
      color:var(--muted);
      font-size:13px;
      margin-top:6px;
    }

    /* Main story card */
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:16px;
      padding:22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      min-height:420px;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.03);
    }

    .card:before{
      content:"";
      position:absolute;
      inset: -30% -20% auto -20%;
      height:220%;
      background: radial-gradient(closest-side, rgba(255,255,255,0.03), transparent 30%);
      transform: rotate(-18deg);
      pointer-events:none;
    }

    .meta{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }
    .tag{
      background:var(--glass);
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      color:var(--muted);
      border:1px solid rgba(255,255,255,0.02);
    }

    .story{
      font-size:18px;
      line-height:1.7;
      color:#f3f7f8;
      white-space:pre-wrap;
      min-height:260px;
      max-height:420px;
      overflow:auto;
      padding-right:8px;
      letter-spacing:0.2px;
      font-weight:300;
    }

    .controls{
      display:flex;
      gap:10px;
      margin-top:18px;
    }

    button, .btn{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      padding:10px 14px;
      border-radius:10px;
      color: #e8eef2;
      cursor:pointer;
      font-weight:600;
      transition: transform .12s ease, box-shadow .12s;
    }
    button:hover{ transform:translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.55) }
    .danger{ border-color: rgba(195,59,59,0.4); color:var(--accent) }

    /* Sidebar */
    aside{
      background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
      border-radius:16px;
      padding:18px;
      height:100%;
      border:1px solid rgba(255,255,255,0.03);
    }
    .list{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:8px;
    }
    .story-item{
      padding:10px;
      border-radius:8px;
      cursor:pointer;
      font-size:14px;
      color:var(--muted);
      background:transparent;
      border:1px dashed rgba(255,255,255,0.02);
    }
    .story-item:hover{ color:#fff; background:var(--glass-2) }

    footer.app-footer{
      grid-column:1/3;
      margin-top:18px;
      text-align:center;
      color:var(--muted);
      font-size:13px;
    }

    .caret{
      display:inline-block;
      width:8px;
      height:22px;
      background:var(--accent);
      margin-left:6px;
      animation: blink 1s steps(2) infinite;
      vertical-align:bottom;
    }
    @keyframes blink{ 50%{ opacity:0 } }

    @media (max-width:880px){
      .app{ grid-template-columns: 1fr; padding:16px }
      aside{ order:2 }
    }

    .flicker{
      animation: flick .9s steps(3) 1;
    }
    @keyframes flick{
      0%{opacity:0}
      10%{opacity:1}
      30%{opacity:.6}
      60%{opacity:1}
      100%{opacity:1}
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="title">
        <h1 class="flicker">Scary Stories</h1>
        <div class="subtitle">Night tales — short and spooky</div>
      </div>

      <div style="display:flex;gap:10px;align-items:center;">
        <div style="font-size:13px;color:var(--muted)">Night Mode</div>
        <button id="ambBtn" title="Ambient sound">🔊</button>
        <button id="randomBtn" title="Random story">Random</button>
      </div>
    </header>

    <main class="card" aria-live="polite">
      <div class="meta">
        <div class="tag" id="tag">Story 1 / 6</div>
        <div style="flex:1"></div>
        <div style="font-size:12px;color:var(--muted)">Language: English</div>
      </div>

      <div class="story" id="story">
        <!-- story text appears here -->
      </div>

      <div class="controls">
        <button id="prev">◀ Previous</button>
        <button id="next">Next ▶</button>
        <button id="reveal" class="danger">Reveal All</button>
      </div>
    </main>

    <aside>
      <div style="font-weight:600">Stories</div>
      <div class="list" id="list">
        <!-- list items -->
      </div>
      <div style="margin-top:12px;font-size:13px;color:var(--muted)">
        For light scares — take a deep breath and smile :)
      </div>
    </aside>

    <footer class="app-footer">© Haunted Night — demo. Fill with your own text.</footer>
  </div>

  <script>
    const STORIES = [
      {
        title: "Polite Guest",
        text: "When he entered, no one noticed. Outside the window, the moon was gone. Anyone who smiled at him saw it vanish from his face... In the dark, he sat silently on the nearest chair."
      },
      {
        title: "Old Mirror",
        text: "You saw yourself in the mirror — but when you touched it, the hand in the mirror responded, slowly moving towards you."
      },
      {
        title: "Night Call",
        text: "The phone rang on and off. While everyone was asleep, a voice that was meant for you echoed — an old man's words, strange and unfamiliar: 'Your name is written here...'"
      },
      {
        title: "Secret Room",
        text: "Pushing the box revealed a tiny crack on the floor. From it came the scent of a letter written a hundred years ago. Opening it, the writing seemed penned by your own hand."
      },
      {
        title: "Jumping Smile",
        text: "A small smile appeared in the guest room. Everyone spoke in normal voices — but a single sound escaped unnoticed, as if someone was listening."
      },
      {
        title: "Eyes From the Window",
        text: "Outside in the dark, eyes gleamed. Unlike any creature, these eyes watched you behind the curtains and silently asked: 'Come in...'"
      }
    ];

    const storyEl = document.getElementById('story');
    const tagEl = document.getElementById('tag');
    const listEl = document.getElementById('list');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const randomBtn = document.getElementById('randomBtn');
    const revealBtn = document.getElementById('reveal');
    const ambBtn = document.getElementById('ambBtn');

    let idx = 0;
    let typing = false;
    let audioCtx, ambientOsc;

    STORIES.forEach((s,i)=>{
      const it = document.createElement('div');
      it.className='story-item';
      it.textContent = `${i+1}. ${s.title}`;
      it.addEventListener('click', ()=> showStory(i));
      listEl.appendChild(it);
    });

    function showStory(i){
      idx = i;
      tagEl.textContent = `Story ${i+1} / ${STORIES.length}`;
      typeWriter(STORIES[i].text);
    }

    async function typeWriter(text){
      if(typing) return;
      typing=true;
      storyEl.textContent = "";
      const speed = 18;
      for(let c=0;c<text.length;c++){
        storyEl.textContent += text[c];
        storyEl.scrollTop = storyEl.scrollHeight;
        await wait(speed + (text[c]==='.'?60:0) + (text[c]==='\n'?120:0));
      }
      typing=false;
    }

    function wait(ms){ return new Promise(res=>setTimeout(res,ms)); }

    prevBtn.addEventListener('click', ()=>{
      if(typing) return;
      idx = (idx-1+STORIES.length)%STORIES.length;
      showStory(idx);
    });
    nextBtn.addEventListener('click', ()=>{
      if(typing) return;
      idx = (idx+1)%STORIES.length;
      showStory(idx);
    });

    randomBtn.addEventListener('click', ()=>{
      const r = Math.floor(Math.random()*STORIES.length);
      showStory(r);
    });

    revealBtn.addEventListener('click', ()=>{
      if(typing) typing=false;
      storyEl.textContent = STORIES[idx].text;
      storyEl.scrollTop = storyEl.scrollHeight;
    });

    ambBtn.addEventListener('click', ()=>{
      if(!audioCtx){
        audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      }
      if(!ambientOsc){
        const o = audioCtx.createOscillator();
        o.type='sine';
        o.frequency.value = 55 + Math.random()*12;
        const gain = audioCtx.createGain();
        gain.gain.value = 0.02;
        o.connect(gain);
        gain.connect(audioCtx.destination);
        o.start();
        ambientOsc = {osc:o,gain:gain};
        ambBtn.textContent = '🔈';
      } else {
        ambientOsc.osc.stop();
        ambientOsc = null;
        ambBtn.textContent = '🔊';
      }
    });

    showStory(0);

    window.addEventListener('keydown', (e)=>{
      if(e.key==='ArrowRight') nextBtn.click();
      if(e.key==='ArrowLeft') prevBtn.click();
      if(e.key===' ') { e.preventDefault(); revealBtn.click(); }
    });

    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      typeWriter = (t)=>{ storyEl.textContent = t; };
      revealBtn.style.display='none';
    }

    window._STORIES = STORIES;
    window._showStory = showStory;
  </script>
</body>
</html>
