<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Қорқынышты Әңгімелер — Түнгі Оқиғалар</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* ===== feature/style ===== */
    :root{
      --bg1: #0b0f12;
      --bg2: #111217;
      --accent: #c33b3b;
      --muted: #9aa0a6;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
    }

    html,body{
      height:100%;
      margin:0;
      font-family:"Inter",system-ui,sans-serif;
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      color:#e8eef2;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    .app{
      width:100%;
      max-width:980px;
      display:grid;
      grid-template-columns:1fr 360px;
      gap:28px;
      align-items:start;
    }

    h1{margin:0;font-family:"Creepster",cursive;font-size:34px;color:var(--accent);text-shadow:0 6px 20px rgba(195,59,59,0.08),0 1px 0 rgba(0,0,0,0.7);}
    .subtitle{color:var(--muted);font-size:13px;margin-top:6px;}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.02);min-height:420px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.03);}
    .meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .tag{background:var(--glass);padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,0.02);}
    .story{font-size:18px;line-height:1.7;color:#f3f7f8;white-space:pre-wrap;min-height:260px;max-height:420px;overflow:auto;padding-right:8px;letter-spacing:0.2px;font-weight:300;}
    .controls{display:flex;gap:10px;margin-top:18px;}
    button{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);padding:10px 14px;border-radius:10px;color:#e8eef2;cursor:pointer;font-weight:600;transition: transform .12s ease, box-shadow .12s;}
    button:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.55);}
    .danger{border-color:rgba(195,59,59,0.4);color:var(--accent);}
    aside{background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);border-radius:16px;padding:18px;border:1px solid rgba(255,255,255,0.03);}
    .list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
    .story-item{padding:10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);background:transparent;border:1px dashed rgba(255,255,255,0.02);}
    .story-item:hover{color:#fff;background:var(--glass-2);}
    footer.app-footer{grid-column:1/3;margin-top:18px;text-align:center;color:var(--muted);font-size:13px;}

    /* ===== feature/navbar ===== */
    nav.navbar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);border-radius:12px;padding:10px 18px;backdrop-filter:blur(6px);margin-bottom:16px;}
    .nav-links{display:flex;gap:20px;}
    .nav-links a{color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;transition:color .2s ease, text-shadow .2s ease;}
    .nav-links a:hover{color:#fff;text-shadow:0 0 6px rgba(195,59,59,0.4);}
  </style>
</head>
<body>
  <div class="app">
    <!-- ===== feature/navbar ===== -->
    <header>
      <nav class="navbar">
        <div class="logo" style="font-family:'Creepster',cursive;color:var(--accent);font-size:20px;">Haunted Night</div>
        <div class="nav-links">
          <a href="#">Home</a>
          <a href="#">Stories</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </div>
      </nav>
    </header>

    <!-- ===== main content ===== -->
    <main class="card">
      <div class="meta">
        <div class="tag" id="tag">Әңгіме 1 / 3</div>
      </div>
      <div class="story" id="story"></div>
      <div class="controls">
        <button id="prev">◀ Алдыңғы</button>
        <button id="next">Келесі ▶</button>
        <button id="randomBtn">Кездейсоқ</button>
        <button id="reveal" class="danger">Барлығын көрсету</button>
      </div>
    </main>

    <!-- ===== sidebar ===== -->
    <aside>
      <div style="font-weight:600">Әңгімелер</div>
      <div class="list" id="list"></div>
      <div style="margin-top:12px;font-size:13px;color:var(--muted)">Жеңіл қорқыныш үшін — терең дем алып, күліңіз :)</div>
    </aside>

    <!-- ===== feature/footer ===== -->
    <footer class="footer">
      <p>&copy; 2024 Тру-крайм Сайт. Все права защищены.</p>
      <div class="social-links">
        <a href="#">VK</a> | <a href="#">Telegram</a>
      </div>
    </footer>
  </div>

  <!-- ===== feature/content JS ===== -->
  <script>
    const STORIES = [
      {title:"Ростов өлтірушісі", text:"Ол қарапайым көшелерде жүрді және қарапайым адам сияқты көрінді. Бірақ ол адамдарды қасқыр қойларды бақылағандай бақылайтын. Көзқарасына түскендер таңдалып қойылғандарын байқамайды. Ол алыстан бақылап жүрді — сабырлы, тыныш — ал олар түсінген кезде, түн олардың дауысын жұтып қойған болатын."},
      {title:"Уайтчепелдің көлеңкесі", text:"Лондонның тар көшелерінде тұман тірі зат сияқты сырғып өтті. Шырақтар жыпылықтады, қадамдар жаңғырықты, және әр бұрышта — қарап тұрған кезде жоғалып кететін силует. Адамдар оны түтін немесе сыбыр, жүрек соғуы арасындағы кеңістік деп айтты. Оның құрбандары соңғы рет артқы жағының салқын демін есінде сақтады."},
      {title:"Сымбатты өлтіруші", text:"Ол жылы жымиып, жұмсақ сөйлеп, адамдарды қауіпсіз сездірді — солайша тұзағы жасалды. Оның құрбандары ешқашан қашпады, айқайламады, өйткені оларға сенім болды. Тек есік жабылған кезде олар оның көзіндегі шындығын көрді: артында ешкім жоқ еді."}
    ];

    const storyEl = document.getElementById('story');
    const tagEl = document.getElementById('tag');
    const listEl = document.getElementById('list');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const randomBtn = document.getElementById('randomBtn');
    const revealBtn = document.getElementById('reveal');

    let idx = 0;
    let typing = false;

    STORIES.forEach((s,i)=>{
      const it = document.createElement('div');
      it.className='story-item';
      it.textContent = `${i+1}. ${s.title}`;
      it.addEventListener('click', ()=> showStory(i));
      listEl.appendChild(it);
    });

    function showStory(i){
      idx=i;
      tagEl.textContent=`Әңгіме ${i+1} / ${STORIES.length}`;
      typeWriter(STORIES[i].text);
    }

    async function typeWriter(text){
      if(typing) return;
      typing=true;
      storyEl.textContent="";
      for(let c=0;c<text.length;c++){
        storyEl.textContent+=text[c];
        storyEl.scrollTop=storyEl.scrollHeight;
        await new Promise(res=>setTimeout(res,18+(text[c]==='.'?60:0)));
      }
      typing=false;
    }

    prevBtn.addEventListener('click', ()=>{ if(!typing){ idx=(idx-1+STORIES.length)%STORIES.length; showStory(idx); } });
    nextBtn.addEventListener('click', ()=>{ if(!typing){ idx=(idx+1)%STORIES.length; showStory(idx); } });
    randomBtn.addEventListener('click', ()=>{ const r=Math.floor(Math.random()*STORIES.length); showStory(r); });
    revealBtn.addEventListener('click', ()=>{ typing=false; storyEl.textContent=STORIES[idx].text; });

    showStory(0);
  </script>
</body>
</html>
