<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Қорқынышты Әңгімелер — Түнгі Оқиғалар</title>

  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1: #0b0f12;
      --bg2: #111217;
      --accent: #c33b3b;
      --muted: #9aa0a6;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
      --nav-height: 72px;
    }

    html,body{
      height:100%;
      margin:0;
      font-family:"Inter",system-ui,sans-serif;
      background:linear-gradient(180deg,var(--bg1),var(--bg2));
      color:#e8eef2;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:32px;
    }

    .app{
      width:100%;
      max-width:980px;
      display:grid;
      grid-template-columns:1fr 360px;
      gap:28px;
      align-items:start;
      margin: 0 auto;
    }

    /* NAVBAR */
    .navbar{
      grid-column:1/3;
      height:var(--nav-height);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 18px;
      background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.03);
      box-shadow:0 8px 30px rgba(0,0,0,0.45);
      position:sticky;
      top:20px;
      z-index:40;
    }

    .nav-left{display:flex;align-items:center;gap:16px}
    .logo{
      font-family:'Creepster',cursive;
      color:var(--accent);
      font-size:20px;
      letter-spacing:0.6px;
    }

    .nav-links{
      display:flex;
      gap:14px;
      align-items:center;
    }

    .nav-links a{
      color:var(--muted);
      text-decoration:none;
      padding:8px 12px;
      border-radius:10px;
      font-weight:600;
      font-size:14px;
    }

    .nav-links a:hover,
    .nav-links a.active{
      color:#fff;
      background:var(--glass-2);
      border:1px solid rgba(255,255,255,0.02);
    }

    .nav-actions{display:flex;align-items:center;gap:10px}
    .btn{
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.04);
      padding:8px 12px;
      border-radius:10px;
      color:#e8eef2;
      cursor:pointer;
      font-weight:600;
    }
    .btn:hover{transform:translateY(-2px)}

    .danger{border-color:rgba(195,59,59,0.4);color:var(--accent)}

    .hamburger{
      display:none;
      background:none;
      border:0;
      cursor:pointer;
      padding:8px;
      border-radius:8px;
      color:var(--muted);
    }

    .hamburger span{
      display:block;
      width:20px;
      height:2px;
      margin:4px 0;
      background:var(--muted);
      border-radius:2px;
    }

    @media (max-width:880px){
      .nav-links{
        position:fixed;
        display:flex;
        flex-direction:column;
        gap:10px;

        padding:12px;

        background:linear-gradient(180deg,rgba(0,0,0,0.45),rgba(0,0,0,0.55));

        border-radius:12px;

        border:1px solid rgba(255,255,255,0.03);
        opacity:0;
        pointer-events:none;
        transform:translateY(-10px);
        transition:all .18s ease;
      }
      .nav-links.open{opacity:1;pointer-events:auto;transform:none}
      .hamburger{display:block}

    }

    /* ORIGINAL PAGE STYLES (kept) */
    .title{display:flex;align-items:baseline;gap:12px;}
    h1{margin:0;font-family:"Creepster",cursive;font-size:34px;color:var(--accent);text-shadow:0 6px 20px rgba(195,59,59,0.08),0 1px 0 rgba(0,0,0,0.7);}
    .subtitle{color:var(--muted);font-size:13px;margin-top:6px;}


    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.02);min-height:420px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.03);}

    .meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .tag{background:var(--glass);padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,0.02);}

    .story{font-size:18px;line-height:1.7;color:#f3f7f8;white-space:pre-wrap;min-height:260px;max-height:420px;overflow:auto;padding-right:8px;letter-spacing:0.2px;font-weight:300;}
    .controls{display:flex;gap:10px;margin-top:18px;}

    button{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);padding:10px 14px;border-radius:10px;color:#e8eef2;cursor:pointer;font-weight:600;transition: transform .12s ease, box-shadow .12s;}
    button:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.55);}

    aside{background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);border-radius:16px;padding:18px;height:100%;border:1px solid rgba(255,255,255,0.03);}
    .list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
    .story-item{padding:10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);background:transparent;border:1px dashed rgba(255,255,255,0.02);}
    .story-item:hover{color:#fff;background:var(--glass-2);}

    /* FOOTER */
    .site-footer {
      grid-column:1/3;
      width:100%;
      margin-top:20px;
      padding:18px 20px;
      border-radius:12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.03);
      box-shadow: 0 8px 30px rgba(0,0,0,0.55);
      color: var(--muted);
    }

    .site-footer__inner {
      max-width:980px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .footer-nav { display:flex; gap:18px; align-items:center; }
    .foot-link { color:var(--muted); text-decoration:none; font-weight:600; padding:6px 10px; border-radius:8px; border:1px solid transparent; }
    .foot-link:hover { background: rgba(255,255,255,0.02); color:#fff; border-color: rgba(255,255,255,0.03); }

    .footer-meta { text-align:right; display:flex; flex-direction:column; gap:4px; min-width:180px; }
    .footer-copy { font-size:14px; color:var(--muted); font-weight:600; }
    .footer-note { font-size:12px; color:rgba(255,255,255,0.6); }

    @media (max-width:720px){
      .site-footer__inner{ flex-direction:column; align-items:center; text-align:center; }
      .footer-meta{ text-align:center; min-width:auto; }
      .footer-nav{ order:2; gap:12px; margin-top:8px; flex-wrap:wrap; justify-content:center; }
    }

  </style>
</head>
<body>
  <div class="app" id="app">

    <!-- NAVBAR (kazakh) -->
    <header class="navbar" role="banner">
      <div class="nav-left">
        <div class="logo">Қорқынышты әңгімелер</div>

        <button class="hamburger" id="navToggle" aria-label="Мәзір ашу" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <nav class="nav-links" id="primaryNav" aria-label="Негізгі">
          <a href="#" class="active">Басты бет</a>
          <a href="#stories">Жаңа әңгімелер</a>
          <a href="#favorites">Таңдаулы</a>
          <a href="#authors">Авторлар</a>
          <a href="#contacts">Байланыс</a>
        </nav>
      </div>

      <div class="nav-actions">
        <button class="btn" id="randomTop">Кездейсоқ</button>
        <button class="btn danger" id="extraTop">Қосымша</button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="card" aria-live="polite">
      <div class="meta">
        <div class="tag" id="tag">Әңгіме 1 / 3</div>
      </div>

      <div class="story" id="story"></div>

      <div class="controls">
        <button id="prev">◀ Алдыңғы</button>
        <button id="next">Келесі ▶</button>
      </div>
    </main>

    <aside>
      <div style="font-weight:600">Әңгімелер</div>
      <div class="list" id="list"></div>
      <div style="margin-top:12px;font-size:13px;color:var(--muted)">Жеңіл қорқыныш үшін — терең дем алып, күліңіз :)</div>
    </aside>

    <!-- FOOTER (kazakh) -->
    <footer class="site-footer" role="contentinfo">
      <div class="site-footer__inner">
        <div class="footer-meta">
          <div class="footer-copy">© Қорқынышты әңгімелер — 2025</div>
          <div class="footer-note">Түн тыныш болсын…</div>
        </div>
      </div>
    </footer>

  </div>

  <script>
    // Stories data
    const STORIES = [
      {title: "Ростов өлтірушісі", text: "Ол қарапайым көшелерде жүрді және қарапайым адам сияқты көрінді. Бірақ ол адамдарды қасқыр қойларды бақылағандай бақылайтын. Көзқарасына түскендер таңдалып қойылғандарын байқамайды. Ол алыстан бақылап жүрді — сабырлы, тыныш — ал олар түсінген кезде, түн олардың дауысын жұтып қойған болатын."},
      {title: "Уайтчепелдің көлеңкесі", text: "Лондонның тар көшелерінде тұман тірі зат сияқты сырғып өтті. Шырақтар жыпылықтады, қадамдар жаңғырықты, және әр бұрышта — қарап тұрған кезде жоғалып кететін силует. Адамдар оны түтін немесе сыбыр, жүрек соғуы арасындағы кеңістік деп айтты. Оның құрбандары соңғы рет артқы жағының салқын демін есінде сақтады."},
      {title: "Сымбатты өлтіруші", text: "Ол жылы жымиып, жұмсақ сөйлеп, адамдарды қауіпсіз сездірді — солайша тұзағы жасалды. Оның құрбандары ешқашан қашпады, айқайламады, өйткені оларға сенім болды. Тек есік жабылған кезде олар оның көзіндегі шындығын көрді: артында ешкім жоқ еді."}
    ];

    // Elements
    const storyEl = document.getElementById('story');
    const tagEl = document.getElementById('tag');
    const listEl = document.getElementById('list');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const randomBtn = document.getElementById('randomTop') || document.getElementById('randomBtn');
    const extraTop = document.getElementById('extraTop') || document.getElementById('extraBtn');

    // Nav
    const navToggle = document.getElementById('navToggle');
    const primaryNav = document.getElementById('primaryNav');

    // Build list
    let idx = 0;
    let typing = false;

    STORIES.forEach((s,i)=>{
      const it = document.createElement('div');
      it.className='story-item';
      it.textContent = (i+1) + '. ' + s.title;
      it.addEventListener('click', ()=> showStory(i));
      listEl.appendChild(it);
    });

    function showStory(i){
      idx = i;
      tagEl.textContent = 'Әңгіме ' + (i+1) + ' / ' + STORIES.length;
      typeWriter(STORIES[i].text);
    }

    async function typeWriter(text){
      if(typing) return;
      typing=true;
      storyEl.textContent = "";
      for(let c=0;c<text.length;c++){
        storyEl.textContent += text[c];
        storyEl.scrollTop = storyEl.scrollHeight;
        await new Promise(res=>setTimeout(res,18 + (text[c]==='.'?60:0)));
      }
      typing=false;
    }

    prevBtn.addEventListener('click', ()=>{ if(!typing){ idx=(idx-1+STORIES.length)%STORIES.length; showStory(idx); } });
    nextBtn.addEventListener('click', ()=>{ if(!typing){ idx=(idx+1)%STORIES.length; showStory(idx); } });

    // Random top button mirrors random behavior
    document.getElementById('randomTop').addEventListener('click', ()=>{ const r=Math.floor(Math.random()*STORIES.length); showStory(r); });

    // Extra top (if used)
    document.getElementById('extraTop').addEventListener('click', ()=>{ window.location.href='extra.html'; });

    showStory(0);

    // NAV toggle for mobile
    navToggle && navToggle.addEventListener('click', ()=>{
      const open = primaryNav.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', String(open));
    });

    // Close nav on link click (mobile)
    primaryNav && primaryNav.addEventListener('click', (e)=>{
      const a = e.target.closest('a');
      if(!a) return;
      primaryNav.querySelectorAll('a').forEach(x=>x.classList.remove('active'));
      a.classList.add('active');
      if(window.innerWidth <= 880){ primaryNav.classList.remove('open'); navToggle.setAttribute('aria-expanded','false'); }
    });

  </script>
</body>
</html>
