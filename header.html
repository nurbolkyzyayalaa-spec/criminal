<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Scary Killers Stories — Haunted Night</title>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1: #0b0f12;
      --bg2: #111217;
      --accent: #c33b3b;
      --muted: #9aa0a6;
      --card: rgba(255,255,255,0.04);
      --glass: rgba(255,255,255,0.03);
      --glass-2: rgba(255,255,255,0.02);
    }
    html,body{height:100%;margin:0;font-family:"Inter",system-ui,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#e8eef2;display:flex;align-items:center;justify-content:center;padding:32px;}
    .app{width:100%;max-width:980px;display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start;}
    header{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .title{display:flex;align-items:baseline;gap:12px;}
    h1{margin:0;font-family:"Creepster",cursive;font-size:34px;color:var(--accent);text-shadow:0 6px 20px rgba(195,59,59,0.08),0 1px 0 rgba(0,0,0,0.7);}
    .subtitle{color:var(--muted);font-size:13px;margin-top:6px;}
    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.02);min-height:420px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.03);}
    .meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
    .tag{background:var(--glass);padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,0.02);}
    .story{font-size:18px;line-height:1.7;color:#f3f7f8;white-space:pre-wrap;min-height:260px;max-height:420px;overflow:auto;padding-right:8px;letter-spacing:0.2px;font-weight:300;}
    .controls{display:flex;gap:10px;margin-top:18px;}
    button{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);padding:10px 14px;border-radius:10px;color:#e8eef2;cursor:pointer;font-weight:600;transition: transform .12s ease, box-shadow .12s;}
    button:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.55);}
    .danger{border-color:rgba(195,59,59,0.4);color:var(--accent);}
    aside{background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);border-radius:16px;padding:18px;height:100%;border:1px solid rgba(255,255,255,0.03);}
    .list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
    .story-item{padding:10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);background:transparent;border:1px dashed rgba(255,255,255,0.02);}
    .story-item:hover{color:#fff;background:var(--glass-2);}
    footer.app-footer{grid-column:1/3;margin-top:18px;text-align:center;color:var(--muted);font-size:13px;}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="title">
        <h1>Scary Killers Stories</h1>
        <div class="subtitle">Night tales — chilling true horror</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;">
        <button id="randomBtn">Random</button>
        <button id="reveal" class="danger">Reveal All</button>
      </div>
    </header>
    <main class="card" aria-live="polite">
      <div class="meta">
        <div class="tag" id="tag">Story 1 / 3</div>
      </div>
      <div class="story" id="story"></div>
      <div class="controls">
        <button id="prev">◀ Previous</button>
        <button id="next">Next ▶</button>
      </div>
    </main>
    <aside>
      <div style="font-weight:600">Stories</div>
      <div class="list" id="list"></div>
      <div style="margin-top:12px;font-size:13px;color:var(--muted)">For light scares — breathe deep and smile :)</div>
    </aside>
    <footer class="app-footer">© Haunted Night — demo. Created by @caytlinisthebest</footer>
  </div>

  <script>
    const STORIES = [
      {
        title: "The Silent Killer",
        text: "A notorious serial killer moved through the town unnoticed. Every house had a secret, and every shadow whispered his name."
      },
      {
        title: "Midnight Stalker",
        text: "People reported a figure lurking in the streets at midnight. Those who looked back never made it home alive."
      },
      {
        title: "The Haunted Asylum",
        text: "Abandoned asylum walls still echo the screams of victims. Visitors hear whispers guiding them into the darkest rooms..."
      }
    ];

    const storyEl = document.getElementById('story');
    const tagEl = document.getElementById('tag');
    const listEl = document.getElementById('list');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const randomBtn = document.getElementById('randomBtn');
    const revealBtn = document.getElementById('reveal');

    let idx = 0;
    let typing = false;

    STORIES.forEach((s,i)=>{
      const it = document.createElement('div');
      it.className='story-item';
      it.textContent = `${i+1}. ${s.title}`;
      it.addEventListener('click', ()=> showStory(i));
      listEl.appendChild(it);
    });

    function showStory(i){
      idx = i;
      tagEl.textContent = `Story ${i+1} / ${STORIES.length}`;
      typeWriter(STORIES[i].text);
    }

    async function typeWriter(text){
      if(typing) return;
      typing=true;
      storyEl.textContent = "";
      for(let c=0;c<text.length;c++){
        storyEl.textContent += text[c];
        storyEl.scrollTop = storyEl.scrollHeight;
        await new Promise(res=>setTimeout(res,18 + (text[c]==='.'?60:0)));
      }
      typing=false;
    }

    prevBtn.addEventListener('click', ()=>{ if(!typing){ idx=(idx-1+STORIES.length)%STORIES.length; showStory(idx); } });
    nextBtn.addEventListener('click', ()=>{ if(!typing){ idx=(idx+1)%STORIES.length; showStory(idx); } });
    randomBtn.addEventListener('click', ()=>{ const r=Math.floor(Math.random()*STORIES.length); showStory(r); });
    revealBtn.addEventListener('click', ()=>{ typing=false; storyEl.textContent=STORIES[idx].text; });

    showStory(0);

    // SCREAMER ON PAGE LOAD
    window.onload = function(){
      const img = document.createElement("img");
      img.src="https://i.imgur.com/your-scary-image.gif"; // замените на свой скример
      img.style.position="fixed";
      img.style.top="0"; img.style.left="0";
      img.style.width="100vw"; img.style.height="100vh";
      img.style.zIndex="9999"; img.style.backgroundColor="#000";
      document.body.appendChild(img);

      const audio = new Audio("https://www.myinstants.com/media/sounds/scream.mp3"); // замените на свой звук
      audio.play();

      setTimeout(()=>{ document.body.removeChild(img); },1500);
    };
  </script>
</body>
</html>
